name: agriconnect

services:

  mysqldb:
    image: mysql:8
    container_name: agriconnect-mysql

    environment:
      MYSQL_ROOT_PASSWORD: docker
      MYSQL_DATABASE: agriconnect

    ports:
      - "3307:3306"

    volumes:
      - agriconnect_mysql_data:/var/lib/mysql

    networks:
      - agriconnect-network

    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-pdocker"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s


  backend:
    image: 2300031688/agriconnect-backend:latest

    container_name: agriconnect-backend

    ports:
      - "2025:8080"

    depends_on:
      mysqldb:
        condition: service_healthy

    restart: on-failure

    networks:
      - agriconnect-network


  frontend:
    image: 2300031688/agriconnect-frontend:latest

    container_name: agriconnect-frontend

    ports:
      - "3000:80"

    depends_on:
      - backend

    restart: on-failure

    networks:
      - agriconnect-network


volumes:
  agriconnect_mysql_data:


networks:
  agriconnect-network:
    driver: bridge